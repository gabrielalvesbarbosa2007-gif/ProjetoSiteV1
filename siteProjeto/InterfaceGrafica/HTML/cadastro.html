<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | SOFOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen flex flex-col bg-slate-50 text-slate-800 overflow-x-hidden">

    <div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat scale-105 blur-md brightness-[0.85]" 
         style="background-image: url('../fotos/fotoFundo.jpg');">
    </div>
    <div class="absolute inset-0 z-0 bg-slate-900/10"></div>

    <header class="w-full bg-[#047857] text-white shadow-sm relative z-10">
        <nav class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center" aria-label="Navegação Principal">
            <div class="text-2xl font-black tracking-wider">SOFOS</div>
            <ul class="flex items-center gap-6 text-sm font-medium">
                <li><a href="index.html" class="hover:text-emerald-200 transition-colors">Acessar Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="relative z-10 flex flex-col flex-grow w-full max-w-7xl mx-auto bg-white shadow-2xl">
        <main class="w-full max-w-md mx-auto px-6 py-12 flex-grow flex flex-col justify-center">
            <div class="bg-white border border-slate-200 shadow-md p-8 rounded-xl w-full">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">Crie sua conta gratuita</h2>
                    <p class="text-slate-500 text-sm mt-1">Tenha acesso completo a simulados e questões.</p>
                </div>

                <form id="cadastro-form" class="space-y-4">
                    <div>
                        <label for="nome" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome Completo</label>
                        <input type="text" id="nome" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-600 text-sm bg-white">
                    </div>

                    <div>
                        <label for="email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail de Estudante</label>
                        <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-600 text-sm bg-white">
                    </div>

                    <div>
                        <label for="data_nascimento" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Data de Nascimento</label>
                        <input type="date" id="data_nascimento" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-600 text-sm bg-white">
                    </div>

                    <div>
                        <label for="senha" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Sua Senha</label>
                        <input type="password" id="senha" required minlength="8" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-600 text-sm bg-white">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-colors mt-6 cursor-pointer text-sm">
                        Finalizar Cadastro e Entrar
                    </button>
                </form>
            </div>
        </main>

        <footer class="w-full bg-white border-t border-slate-200 text-xs text-slate-400 py-6 mt-auto">
            <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-2">
                <p>&copy; 2026 SOFOS Plataforma de Estudos. Todos os direitos reservados.</p>
                <div class="flex gap-4">
                    <a href="#" class="hover:text-emerald-600 transition-colors">Termos de Uso</a>
                    <a href="#" class="hover:text-emerald-600 transition-colors">Privacidade</a>
                </div>
            </div>
        </footer>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
