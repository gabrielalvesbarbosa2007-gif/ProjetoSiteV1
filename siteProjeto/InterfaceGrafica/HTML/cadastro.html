<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Plataforma de Estudos - Cadastro</title>
</head>
<body class="login-page">

    <div class="login-container">
        <header>
            <h1>Painel Estudante</h1>
        </header>
        
        <form style="width: 100%;" id="cadastro-form">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail de Estudante:</label>
                <input type="email" id="email" placeholder="Seu e-mail" required>
            </div>
          <div class="form-group">
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" required>
    </div>
            
            <div class="form-group">
                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>
            </div>
            
            <button type="submit" class="btn">Cadastrar</button>
        </form>

        <a href="index.html" class="login-link">Já tem uma conta? Faça login</a>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
