<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Faça login na plataforma SOFOS e acesse seus simulados.">
    <title>Login | SOFOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen flex flex-col justify-between text-slate-800 overflow-x-hidden">

    <!-- 1. CAMADA DE FUNDO (A Imagem abrangendo tudo e desfocada) -->
    <div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat scale-105 blur-md brightness-[0.85]" 
         style="background-image: url('../fotos/fotoFundo.jpg');">
    </div>
    
    <!-- Película escura opcional para aumentar o contraste dos textos -->
    <div class="absolute inset-0 z-0 bg-slate-900/10"></div>

    <!-- 2. CONTEÚDO DA PÁGINA (Acima do fundo, controlado pelo z-10) -->
    <header class="w-full bg-[#047857]/90 text-white shadow-md backdrop-blur-sm relative z-10">
        <nav class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center" aria-label="Navegação Principal">
            <div class="text-2xl font-black tracking-wider">SOFOS</div>
            <ul class="flex items-center gap-6 text-sm font-medium">
                <li><a href="sobre.html" class="hover:text-emerald-200 transition-colors">Sobre Nós</a></li>
            </ul>
        </nav>
    </header>

    <main class="w-full max-w-md mx-auto px-6 py-12 flex-grow flex flex-col justify-center relative z-10">
        <!-- Card de Login com efeito Glassmorphism sutil -->
        <div class="bg-white/95 border border-slate-200/50 p-8 rounded-2xl shadow-2xl w-full backdrop-blur-md">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Acesse sua Conta</h2>
                <p class="text-slate-500 text-sm mt-1">Insira suas credenciais para continuar.</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-600 text-sm bg-white" placeholder="exemplo@email.com">
                </div>

                <div>
                    <label for="senha" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha</label>
                    <input type="password" id="senha" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-600 text-sm bg-white" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-colors mt-6 cursor-pointer text-sm shadow-md">
                    Entrar na Plataforma
                </button>
            </form>

            <div class="text-center mt-6 pt-4 border-t border-slate-100 text-sm text-slate-600">
                Não tem uma conta? 
                <a href="cadastro.html" class="text-emerald-600 hover:text-emerald-700 font-semibold transition-colors">Cadastre-se</a>
            </div>
        </div>
    </main>

    <!-- Footer transparente para se fundir ao cenário -->
    <footer class="w-full text-xs text-white/80 py-6 relative z-10 bg-slate-900/40 border-t border-white/10 backdrop-blur-sm">
        <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-2">
            <p>&copy; 2026 SOFOS Plataforma de Estudos. Todos os direitos reservados.</p>
            <div class="flex gap-4">
                <a href="#" class="hover:text-emerald-300 transition-colors">Termos de Uso</a>
                <a href="#" class="hover:text-emerald-300 transition-colors">Privacidade</a>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
