<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Plataforma de Estudos - Login</title>
</head>
<body class="login-page">

    <div class="login-container">
        <header>
            <h1>Painel Estudante</h1>
        </header>
        
        <form action="performance.html" method="GET" style="width: 100%;">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>
            
            <button type="submit" class="btn">Acessar</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #64748b;">
            Ou acesse com
        </div>
        <div class="google-login-circle" title="Login com o Google">
